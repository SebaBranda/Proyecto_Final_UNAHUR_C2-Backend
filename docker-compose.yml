services:
  # Servicio de MongoDB
  mongodb:
    image: mongo:7.0
    container_name: galacticapp_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:?MONGO_DB is required}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - galacticapp_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio del Backend Node.js
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galacticapp_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ALLOW_MEMORY_FALLBACK: "false"
      MONGO_URI: mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27017/${MONGO_DB:?MONGO_DB is required}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # En desarrollo, montar el código para hot-reload
      - .:/app
      - /app/node_modules
    networks:
      - galacticapp_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  galacticapp_network:
    driver: bridge
